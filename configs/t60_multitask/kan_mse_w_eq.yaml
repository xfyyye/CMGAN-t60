experiment:
  name: kan_multitask_w_eq            # alpha=1.0, beta=1.0 —— 等权
  output_root: runs

model:
  n_tscb: 2                           # 2 层 TSCB (默认更快)
  t60_head_type: fourier_kan          # KAN T60 head
  t60_fourier_proj_dim: 64
  t60_fourier_hidden_dims: [32, 16]
  t60_fourier_first_num_frequencies: 16
  t60_fourier_hidden_num_frequencies: 8
  t60_fourier_dropout: 0.1
  t60_out_activation: sigmoid

data:
  dataset_root: /mnt/tidal-sh01/usr/chuan/youling/project/dataset/T60_Dataset_v7_4s
  n_fft: 400
  hop_length: 100
  audio_length: 4.0
  target_sr: 16000
  t60_min: 0.1
  t60_max: 1.5

train:
  batch_size: 32
  accum_steps: 1
  max_epochs: 100
  lr: 0.0005
  weight_decay: 0.00001
  early_stop_patience: 15
  num_workers: 16
  clip_grad_norm: 5.0

test:
  batch_size: 8
  num_workers: 4
  gpu_id: 0

loss:
  name: mse                           # T60 子损失
  alpha: 1.0                          # 去噪损失权重
  beta: 1.0                           # T60 损失权重
  w_ri: 0.1                           # 去噪 RI MSE 权重
  w_mag: 0.9                          # 去噪 Magnitude MSE 权重
  w_time: 0.2                         # 去噪 时域 L1 权重

probe:
  log_every: 20                       # 每 20 个 train step 测一次梯度夹角
  include_shared_all: false

logging:
  swanlab_project: T60_KAN_MultiTask
