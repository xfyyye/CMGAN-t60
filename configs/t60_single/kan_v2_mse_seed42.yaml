experiment:
  name: single_t60_kan_v2_mse_seed42
  output_root: runs

model:
  n_tscb: 2
  t60_head_type: fourier_kan
  t60_hidden_dim: 128
  t60_dropout: 0.3
  t60_fourier_proj_dim: 64
  t60_fourier_hidden_dims: [32, 16]
  t60_fourier_first_num_frequencies: 16
  t60_fourier_hidden_num_frequencies: 8
  t60_fourier_dropout: 0.1
  t60_out_activation: sigmoid

data:
  dataset_root: /home/ubuntu/xiexinni/t60/dataset
  n_fft: 400
  hop_length: 100
  audio_length: 4.0
  target_sr: 16000
  t60_min: 0.1
  t60_max: 1.5

train:
  seed: 42
  batch_size: 16
  accum_steps: 1
  max_epochs: 100
  lr: 0.0005
  weight_decay: 0.00001
  early_stop_patience: 15
  num_workers: 8
  clip_grad_norm: 5.0

test:
  batch_size: 8
  num_workers: 4
  gpu_id: 0

loss:
  name: mse

logging:
  swanlab_project: T60_Estimation
